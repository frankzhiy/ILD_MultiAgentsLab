provider: apiyi
model: gpt-5.6-luna
base_url: https://api.apiyi.com/v1
api_key_env: APIYI_API_KEY
request_options:
  reasoning_effort: none
supports_json_schema: true
timeout_seconds: 300
temperature: 0.0
max_tokens: 12000
max_attempts: 2
retry_backoff_seconds: 2
initial_specimen_reconstruction_prompt: src/prompts/pathology/initial_specimen_reconstruction.md
initial_morphologic_assessment_prompt: src/prompts/pathology/initial_morphologic_assessment.md
initial_consult_formulation_prompt: src/prompts/pathology/initial_consult_formulation.md
discussion_evidence_mapping_prompt: src/prompts/pathology/discussion_evidence_mapping.md
discussion_state_update_prompt: src/prompts/pathology/discussion_state_update.md
discussion_consult_response_prompt: src/prompts/pathology/discussion_consult_response.md

guideline_retrieval:
  enabled: true
  directory: data/guidelines
  limit: 6
  limits:
    initial_specimen_reconstruction: 3
    initial_morphologic_assessment: 6
    initial_consult_formulation: 4
    discussion_evidence_mapping: 0
    discussion_state_update: 4
    discussion_consult_response: 4
  scope:
    - ers-ats-iip-classification-2025
    - ats-ers-jrs-alat-ipf-ppf-2022
    - cts-ild-mdd-2023-zh
    - cra-ctd-ild-2022-zh
    - ers-eular-ctd-ild-2025
    - acr-chest-sard-ild-2023
  queries:
    initial_specimen_reconstruction: ILD 肺活检标本类型、取材代表性、标本充分性和采样误差应如何评价
    initial_morphologic_assessment: ILD 组织病理如何区分 UIP NSIP BIP DAD PPFE LIP OP RB-ILD AMP 及联合模式
    initial_consult_formulation: 病理模式、疾病诊断、诊断信度、不能分类 ILD 和追加组织检查应如何表达
    discussion_evidence_mapping: ILD 多学科讨论中病理如何映射临床影像风湿意见并保留冲突
    discussion_state_update: 新增多学科证据如何改变病理标本代表性、病因提示和模式信度
    discussion_consult_response: ILD 病理会诊如何回答主席问题并表达模式病因提示限制和下一步诊断建议

clinical_rules:
  morphology:
    guideline_id: ers-ats-iip-classification-2025
    separate_pattern_from_disease: true
    sequence:
      - tissue_compartment
      - spatial_and_temporal_architecture
      - key_positive_and_negative_features
      - dominant_pattern
      - coexisting_pattern_and_acute_overlay
      - etiologic_clues
    recognized_patterns:
      - UIP
      - NSIP
      - BIP
      - DAD
      - PPFE
      - LIP
      - OP
      - RB-ILD
      - AMP
      - rare_alveolar_filling_pattern
      - combined_pattern
      - unclassifiable_pattern
  ipf_histopathology:
    guideline_id: ats-ers-jrs-alat-ipf-ppf-2022
    applicability: 仅用于临床上疑似 IPF 且存在可解释肺组织的情境
    categories:
      - UIP
      - probable_UIP
      - indeterminate_for_UIP
      - alternative_diagnosis
    downgrade_for_transbronchial_cryobiopsy: true
  terminology:
    guideline_id: ers-ats-iip-classification-2025
    BIP_is_pattern_not_HP_diagnosis: true
    AMP_replaces_DIP: true
    preserve_source_term: true
  sampling:
    guideline_id: cts-ild-mdd-2023-zh
    principles:
      - 结合 HRCT 病变分布判断取材代表性
      - 理想条件下从多个肺叶或肺段取材
      - 避免正常肺和终末期纤维化区
      - TBLC 对胸膜下结构和空间异质性的评价弱于 SLB
  biopsy_scope:
    guideline_ids:
      - ats-ers-jrs-alat-ipf-ppf-2022
      - ers-eular-ctd-ild-2025
      - acr-chest-sard-ild-2023
      - cts-ild-mdd-2023-zh
    principles:
      - 组织检查必须解决明确诊断问题并可能改变管理
      - CTD-ILD 诊断和筛查不常规依赖肺活检
      - 疑似 IPF 的 UIP 或 probable UIP HRCT 在合适临床背景下可不经肺活检诊断
      - 是否实施 SLB 或 TBLC 由 MDT 结合风险收益和中心经验决定
  boundaries:
    guideline_id: cts-ild-mdd-2023-zh
    text_only_pathology_input: true
    direct_slides_reviewed: false
    final_mdt_diagnosis_by_team: true
    pathology_must_not_equate_pattern_with_disease: true
    pathology_must_not_decide_procedural_risk: true
