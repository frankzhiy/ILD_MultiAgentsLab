provider: apiyi
model: gpt-5.6-luna
# deepseek-v4-flash
base_url: https://api.apiyi.com/v1
api_key_env: APIYI_API_KEY
request_options:
  thinking:
    type: disabled
timeout_seconds: 300
temperature: 0.0
max_tokens: 12000
max_attempts: 3
retry_backoff_seconds: 3
initial_case_reconstruction_prompt: src/prompts/thoracic_radiology/initial_case_reconstruction.md
initial_consult_formulation_prompt: src/prompts/thoracic_radiology/initial_consult_formulation.md
discussion_evidence_mapping_prompt: src/prompts/thoracic_radiology/discussion_evidence_mapping.md
discussion_update_and_response_prompt: src/prompts/thoracic_radiology/discussion_update_and_response.md

clinical_rules:
  morphology:
    source: ERS/ATS Statement 2025 (Eur Respir J 2025;66:2500158)
    separate_pattern_from_disease: true
    high_level_sequence:
      - interstitial_or_alveolar_filling
      - fibrotic_or_nonfibrotic
      - craniocaudal_and_axial_distribution
      - key_morphologic_features
      - primary_and_coexisting_patterns
    recognized_patterns:
      - UIP
      - NSIP
      - BIP
      - DAD
      - PPFE
      - LIP
      - OP
      - RB-ILD
      - AMP
      - combined_pattern
      - unclassifiable_pattern
  diagnostic_confidence:
    source: ERS/ATS Statement 2025 (Eur Respir J 2025;66:2500158)
    confident_probability: ">=90%"
    provisional_probability: "51-89%"
    unclassifiable: "完成充分评估后，无任何单一模式概率超过 50%"
  ipf_hrct:
    source: ATS/ERS/JRS/ALAT Clinical Practice Guideline 2022
    applicability: 仅用于临床上疑似 IPF 的情境
    categories:
      - UIP
      - probable_UIP
      - indeterminate_for_UIP
      - alternative_diagnosis
  radiologic_progression:
    source: ATS/ERS/JRS/ALAT Clinical Practice Guideline 2022
    features:
      - increased_traction_bronchiectasis_or_bronchiolectasis
      - new_ground_glass_with_traction_bronchiectasis
      - new_fine_reticulation
      - increased_or_coarser_reticulation
      - new_or_increased_honeycombing
      - increased_lobar_volume_loss
    prohibit_full_ppf_diagnosis: true
  acquisition:
    source: 间质性肺疾病多学科讨论规范中国专家共识
    thin_section_max_mm: 1.5
    conditional_series:
      expiratory: 疑似 HP、RB-ILD 或需评价气体潴留时
      prone: 需区分背侧依赖性密度增高与真实胸膜下病变时
      contrast_enhanced: 存在需要增强检查解决的特定异常时
