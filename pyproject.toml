[project]
name = "ild-multiagents-lab"
version = "0.1.0"
description = "Research code for LLM-based multi-agent ILD diagnostic reasoning."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.0",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6.0",
  "rich>=13.0",
  "pymupdf4llm>=0.3,<1",
  "qdrant-client>=1.14,<2",
  "sentence-transformers>=5,<6",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
guideline-model-download = ["modelscope>=1.20,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
